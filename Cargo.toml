[package]
name = "mcpg-plugin-watch-cron"
version = "0.1.0-alpha.15"
license = "Apache-2.0"
edition = "2024"
description = "Cron / interval watch_strategy plugin for MCPG (dev.mcpg.watch.cron) — periodic resource-change ticks; no network."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13", features = ["static-firstparty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = "0.15"
tracing = "0.1"

[features]
default = []
cdylib-export = []
static-firstparty = []
